# Isolated exact-3d experiment sandbox (overhaul stage 0.5 — 3D TIP math go/no-go).
#
# The empty [workspace] table makes this a standalone workspace root, so the nacre
# root workspace (members = ["crates/*"]) never includes it — root build and test
# are unaffected. Depends on the verified nacre-scalar (Rat/Angle) plus the same
# arbitrary-precision layer the 2D experiment used; the 3D Pt3/orient3d_judge are
# built fresh here (that is the experiment) and ported into nacre-scalar at stage 2.
[workspace]

[package]
name = "exact3d"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
nacre-scalar = { path = "../../crates/nacre-scalar" }
astro-float = "0.9.5"
num-rational = "0.4"
num-traits = "0.2"
