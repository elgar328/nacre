# nacre workspace. The top-level `nacre` facade crate re-exports the layers.
# A crate is added when a milestone needs it — not up front.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elgar328/nacre"
rust-version = "1.85"

[workspace.dependencies]
proptest = "1"
rayon = "1"

# The dependencies between the layers. A published crate cannot depend on a path alone, and
# a version requirement cannot refer to the workspace version, so the version string is
# written here once per layer. This file is the only one a version bump touches
# (`docs/RELEASING.md`).
#
# ★ Normal dependencies only. Dev-dependencies between siblings stay `{ path = "..." }` and
# must not inherit from here: a dev-dependency with a version is kept in the published
# manifest, and the layers' tests depend on each other in a cycle (`nacre-ops`'s tests use
# the layers above it, and theirs use `nacre-ops`), which would leave no valid publish order.
nacre-store = { path = "crates/nacre-store", version = "0.0.1-dev" }
nacre-math = { path = "crates/nacre-math", version = "0.0.1-dev" }
nacre-exact = { path = "crates/nacre-exact", version = "0.0.1-dev" }
nacre-predicates = { path = "crates/nacre-predicates", version = "0.0.1-dev" }
nacre-geom = { path = "crates/nacre-geom", version = "0.0.1-dev" }
nacre-judge = { path = "crates/nacre-judge", version = "0.0.1-dev" }
nacre-topo = { path = "crates/nacre-topo", version = "0.0.1-dev" }
# Without defaults, so the facade's own `parallel` feature is what turns rayon on.
nacre-ops = { path = "crates/nacre-ops", version = "0.0.1-dev", default-features = false }
nacre-props = { path = "crates/nacre-props", version = "0.0.1-dev" }
nacre-step = { path = "crates/nacre-step", version = "0.0.1-dev" }
nacre-tess = { path = "crates/nacre-tess", version = "0.0.1-dev" }
nacre-validate = { path = "crates/nacre-validate", version = "0.0.1-dev" }

# ★★★★★ **The tests are the slow thing, and they are slow for one reason: the optimizer level.**
#
# This kernel's inner loop is exact arithmetic — `i128` rationals, `BigInt` towers, sign
# predicates evaluated hundreds of thousands of times per boolean — and at `opt-level = 0` that
# runs about **nine times** slower than it needs to. Measured on `nacre-ops`' library tests, same
# session, same machine:
#
#   opt-level 0 : 68.4s to run     debug 2 : a 32 MB test binary
#   opt-level 2 :  7.9s to run     debug 1 : a 11.7 MB one
#
# ★ **And it costs nothing where it would hurt.** The edit-compile loop is what a session actually
# spends its time in, and incremental compilation keeps it flat: 1.22s at `opt-level 0`, **1.14s**
# at 2, for the same one-line edit. The optimizer is paid for once per cold build, not per edit.
#
# ★★ `debug = 1` is line tables without the full DWARF. A panic still names its file and line —
# that comes from `Location`, which the compiler bakes in whatever this says — and a backtrace
# still resolves frames. What goes is the variable-level detail a debugger wants, and with it most
# of the artifact size: `target/debug` was measured to grow **9.1 GB in a single session**, of
# which the leftover test binaries (one per edit, never collected by cargo) were the largest
# movable part.
[profile.dev]
opt-level = 2
debug = 1

[profile.test]
opt-level = 2
debug = 1
