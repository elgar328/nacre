[package]
name = "nacre-oracle"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Dev-only OCCT oracle harness for the nacre CAD kernel (design §7) — exports a Model to STEP and scores its mass properties against OpenCASCADE out-of-process via tools/occt-helper. Never published; OCCT is never linked into the kernel"

[dependencies]
nacre-topo = { path = "../nacre-topo", version = "0.0.0" }
nacre-step = { path = "../nacre-step", version = "0.0.0" }
nacre-math = { path = "../nacre-math", version = "0.0.0" }

[dev-dependencies]
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
