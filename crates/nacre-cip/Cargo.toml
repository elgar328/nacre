[package]
name = "nacre-cip"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rotated-vertex Pt3 assembly (§CIP) over the nacre b-rep Model — assembles a vertex's exact definition + directional tol from the rotation forest for the boolean's sign judges"

[dependencies]
nacre-scalar = { path = "../nacre-scalar", version = "0.0.0" }
nacre-predicates = { path = "../nacre-predicates", version = "0.0.0" }
nacre-math = { path = "../nacre-math", version = "0.0.0" }
astro-float = "0.9.5"

[features]
# When on, the memoized high-precision cell in the kernel's `Pt3` is `Arc<OnceLock>`
# (Send + Sync) instead of `Rc<OnceCell>`, letting a `Pt3` cross threads for the parallel
# boolean. Off by default; a consumer (nacre-ops) turns it on via its own `parallel` feature.
parallel = []

[dev-dependencies]
proptest.workspace = true
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
