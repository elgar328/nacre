[package]
name = "nacre-cip"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rotated-vertex WitnessPoint assembly (§CIP) over the nacre b-rep Model — assembles a vertex's exact definition + directional tol from the rotation forest for the boolean's sign judges"

[dependencies]
nacre-scalar = { path = "../nacre-scalar", version = "0.0.0" }
nacre-predicates = { path = "../nacre-predicates", version = "0.0.0" }
nacre-math = { path = "../nacre-math", version = "0.0.0" }
astro-float = "0.9.5"
# Wide frames (S4): a plane whose canonical data exceeds `i128` realizes from arbitrary-precision
# integers. Pure Rust, and already in the product path via nacre-scalar.
num-bigint = "0.4"
num-integer = "0.1"

[features]
# When on, the memoized high-precision cell in the kernel's `WitnessPoint` is `Arc<OnceLock>`
# (Send + Sync) instead of `Rc<OnceCell>`. That is what makes the plane table `Sync`, so the
# parallel boolean's workers can *share* it -- the load is on the shared borrow, not on
# anything a worker returns. Off by default; nacre-ops turns it on via its own `parallel`.
parallel = []

[dev-dependencies]
proptest.workspace = true
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
