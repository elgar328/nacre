[package]
name = "nacre-ops"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "operations for the nacre CAD kernel — sketch profiles, extrude, and a replayable operation log (M2: planar-profile prism extrude)"

[dependencies]
nacre-topo = { path = "../nacre-topo", version = "0.0.0" }
nacre-geom = { path = "../nacre-geom", version = "0.0.0" }
nacre-math = { path = "../nacre-math", version = "0.0.0" }
nacre-store = { path = "../nacre-store", version = "0.0.0" }
# Rational scalars + the Isometry carried by the Transform op (overhaul stage 1).
nacre-scalar = { path = "../nacre-scalar", version = "0.0.0" }
# Read-only CIP analysis (rotated-vertex WitnessPoint + indirect judges) for the toleranced
# boolean predicates (overhaul stage 3). tip's dep on nacre-ops is dev-only (a separate
# target), so the lib dependency graph stays acyclic.
nacre-cip = { path = "../nacre-cip", version = "0.0.0" }
# Data-parallel evaluation of the boolean's three independent phases: the arrangement's
# per-plane-class trace/split and cell build (`arrangement::trace_result_faces`), and the
# per-point precision reading (`planes::standard_for_points`). Optional + behind the
# default-on `parallel` feature, so a single-threaded / wasm build
# (`--no-default-features`) links no rayon. `src/par.rs` is the only place the switch lives.
rayon = { workspace = true, optional = true }
# Exact integer coordinates: `MeetPoint::lift` hands out `(BigInt, BigInt)` and `src/realize.rs`
# divides them. Already in the product tree through num-rational; declaring it makes that explicit.
num-bigint = "0.4"

[features]
# Parallelize the boolean's three independent phases via rayon, and switch `WitnessPoint`'s hp cache
# to `Arc<OnceLock>` (through `nacre-cip/parallel`) so the shared plane table is `Sync`. On
# by default; `--no-default-features` gives the serial, rayon-free, `Rc<OnceCell>` build --
# which is what the wasm playground takes, and which nothing else builds, so check it with
# `cargo test -p nacre-ops --no-default-features` (a workspace build unifies `parallel` back
# on through nacre-oracle's and nacre-props's dev-dependencies).
default = ["parallel"]
parallel = ["dep:rayon", "nacre-cip/parallel"]
# Print every reject as it is raised and as it surfaces (`src/reject_census.rs`). Off by default,
# so a product build compiles no printing at all — this is the one exception to the crate's
# `deny(clippy::print_stderr)`. It exists because the in-memory census dies with its process and
# the population worth sweeping is spread over ~30 test binaries:
#   cargo test --workspace --features nacre-ops/reject-trace -- --nocapture 2>&1 | grep '^RAISE '
# The census itself is unconditional; only the printing is behind this.
reject-trace = []
# The tangency population instrument: print one line per tangency row, and one per wall face the
# footprint reader could not read. Off by default, and behind a feature rather than `cfg(test)`
# because the population worth counting lives in the **integration** corpus (`tests/census.rs`),
# where `cfg(test)` is not set for this crate — a trap this repo has hit twice:
#   cargo test --workspace --features nacre-ops/tangency-trace -- --nocapture 2>&1 | grep '^TROW '
tangency-trace = []

[dev-dependencies]
# Enables the topo test-only primitive `Model::add_cuboid` for building test solids
# (unusable in production; this crate sits above topo but tests build boxes directly).
nacre-topo = { path = "../nacre-topo", version = "0.0.0", features = ["test-util"] }
proptest.workspace = true
# Tests assert the extruded solids are valid closed b-reps.
nacre-validate = { path = "../nacre-validate", version = "0.0.0" }
# The end-to-end example/integration test exports models through these; they are
# dev-only so the published lib's dependency surface stays clean (no cycle: neither
# depends on nacre-ops).
nacre-step = { path = "../nacre-step", version = "0.0.0" }
nacre-tess = { path = "../nacre-tess", version = "0.0.0", features = ["test-util"] }
# Boolean tests diff result volumes against the analytic mass properties.
nacre-props = { path = "../nacre-props", version = "0.0.0" }
# The wide-name rescue tests hand-build synthetic `PlaneName::Wide` fixtures (production code
# reaches BigInt only through nacre-cip's types).
num-bigint = "0.4"
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
