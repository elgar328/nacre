[package]
name = "nacre-ops"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "operations for the nacre CAD kernel — sketch profiles, extrude, and a replayable operation log (M2: planar-profile prism extrude)"

[dependencies]
nacre-topo = { path = "../nacre-topo", version = "0.0.0" }
nacre-geom = { path = "../nacre-geom", version = "0.0.0" }
nacre-math = { path = "../nacre-math", version = "0.0.0" }
nacre-store = { path = "../nacre-store", version = "0.0.0" }

[dev-dependencies]
proptest.workspace = true
# Tests assert the extruded solids are valid closed b-reps.
nacre-validate = { path = "../nacre-validate", version = "0.0.0" }
# The end-to-end example/integration test exports models through these; they are
# dev-only so the published lib's dependency surface stays clean (no cycle: neither
# depends on nacre-ops).
nacre-step = { path = "../nacre-step", version = "0.0.0" }
nacre-tess = { path = "../nacre-tess", version = "0.0.0" }
# Boolean tests diff result volumes against the analytic mass properties.
nacre-props = { path = "../nacre-props", version = "0.0.0" }
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
