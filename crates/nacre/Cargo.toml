[package]
name = "nacre"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "An exact b-rep CAD kernel in pure Rust: exact geometry is the source of truth; coordinates and meshes are caches derived from it. This facade is the one crate to depend on."
readme = "../../README.md"
keywords = ["cad", "brep", "nurbs", "geometry", "kernel"]
categories = ["mathematics"]

[features]
default = ["parallel"]
# Parallelize the boolean's independent read-only predicate phases via rayon.
# `--no-default-features` gives the serial, rayon-free build a wasm target needs.
# **Not only a speed switch:** turning it off also switches the CIP kernel's
# high-precision cache from `Arc<OnceLock>` to `Rc<OnceCell>`, so the affected values
# stop being `Send`. A consumer that drops this for wasm gives up moving them across
# threads too.
parallel = ["nacre-ops/parallel"]
# Exposes topo's test-only doors (the planting pushes, `reversed_shell`, `plane_name_through`)
# and its push counters (every surface push then counts). Off by default so production
# consumers never see them; enable it in your own `[dev-dependencies]` to plant a model at the
# topology layer.
test-util = ["nacre-topo/test-util"]

[dependencies]
# Every re-exported layer must be a real dependency — `pub use nacre_x as x` does not
# compile otherwise. Path and version come from the root `[workspace.dependencies]`.
nacre-geom = { workspace = true }
nacre-math = { workspace = true }
# Taken without defaults so this crate's own `parallel` feature is what turns rayon
# on. Wiring it with defaults would leave a consumer no way to turn it off.
nacre-ops = { workspace = true, default-features = false }
nacre-props = { workspace = true }
nacre-exact = { workspace = true }
nacre-step = { workspace = true }
nacre-store = { workspace = true }
nacre-tess = { workspace = true }
nacre-topo = { workspace = true }
nacre-validate = { workspace = true }

[dev-dependencies]
# The integration tests build fixture solids the way an application does
# (`nacre_ops::fixtures`). Enabling the feature here — rather than through this crate's
# own `test-util` — keeps those tests in the default `cargo test` run; a
# `#[cfg(feature = "...")]` test would never run. Without defaults, for the reason the
# `[dependencies]` entry gives: `--no-default-features` must stay serial.
nacre-ops = { path = "../nacre-ops", default-features = false, features = ["test-util"] }
nacre-topo = { path = "../nacre-topo", features = ["test-util"] }
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
