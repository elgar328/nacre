[package]
name = "nacre-props"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Exact mass properties (volume, surface area) for the nacre CAD kernel — analytic on the exact geometry via the divergence theorem (no tessellation). A read-only analysis over the topology Model, kept out of nacre-topo to preserve its truth-only aggregate"

[dependencies]
nacre-topo = { workspace = true }
nacre-geom = { workspace = true }
nacre-math = { workspace = true }
nacre-store = { workspace = true }

[dev-dependencies]
# Enables topo's test-only `reversed_shell` (a cavity's shell, for the void tests).
nacre-topo = { path = "../nacre-topo", features = ["test-util"] }
# Builds a concave extruded prism to test the area-weighted centroid path.
nacre-ops = { path = "../nacre-ops", features = ["test-util"] }
# `Axis`, to name the world plane a test sketch sits on (an extrude names its plane).
nacre-exact = { path = "../nacre-exact" }
proptest.workspace = true
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
