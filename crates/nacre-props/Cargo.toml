[package]
name = "nacre-props"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Exact mass properties (volume, surface area) for the nacre CAD kernel — analytic on the exact geometry via the divergence theorem (no tessellation). A read-only analysis over the topology Model, kept out of nacre-topo to preserve its truth-only aggregate"

[dependencies]
nacre-topo = { path = "../nacre-topo", version = "0.0.0" }
nacre-geom = { path = "../nacre-geom", version = "0.0.0" }
nacre-math = { path = "../nacre-math", version = "0.0.0" }
nacre-store = { path = "../nacre-store", version = "0.0.0" }

[dev-dependencies]
# Enables the topo test-only primitive `Model::add_cuboid` for building test solids.
nacre-topo = { path = "../nacre-topo", version = "0.0.0", features = ["test-util"] }
# Builds a concave extruded prism to test the area-weighted centroid path.
nacre-ops = { path = "../nacre-ops", version = "0.0.0", features = ["test-util"] }
# `Axis`, to name the world plane a test sketch sits on (an extrude names its plane).
nacre-exact = { path = "../nacre-exact", version = "0.0.0" }
proptest.workspace = true
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
