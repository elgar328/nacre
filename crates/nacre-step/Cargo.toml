[package]
name = "nacre-step"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "STEP (AP242 Ed2) export for the nacre CAD kernel — a thin adapter translating the kernel Model into AP242 entities behind a swappable serialization backend (step-io during development)"

[dependencies]
nacre-topo = { path = "../nacre-topo", version = "0.0.0" }
nacre-geom = { path = "../nacre-geom", version = "0.0.0" }
nacre-math = { path = "../nacre-math", version = "0.0.0" }
nacre-store = { path = "../nacre-store", version = "0.0.0" }
# Serialization backend (kernel is backend-agnostic; step-io is confined to this
# crate). StepBuilder has existed since 0.1.0, so ^0.2 (→ 0.2.2) works.
step-io = "0.2.4"

[dev-dependencies]
# Test cylinders are built the way an application builds one — a datum, a circle, an extrude
# (`nacre_ops::fixtures`). Dev-only, and nacre-ops depends on this crate only as a dev-dependency
# too, so the library graph stays acyclic (the nacre-props shape).
nacre-ops = { path = "../nacre-ops", version = "0.0.0", features = ["test-util"] }
# Enables topo's test-only `reversed_shell` (a cavity's shell, for the void export test).
nacre-topo = { path = "../nacre-topo", version = "0.0.0", features = ["test-util"] }
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
