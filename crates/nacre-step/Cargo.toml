[package]
name = "nacre-step"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Compact, shape-only STEP (AP242) export for the nacre CAD kernel"
readme = "../LAYER-README.md"

[dependencies]
nacre-topo = { workspace = true }
nacre-geom = { workspace = true }
nacre-math = { workspace = true }
nacre-store = { workspace = true }
# Serialization backend (kernel is backend-agnostic; step-io is confined to this
# crate). StepBuilder has existed since 0.1.0, so ^0.2 (→ 0.2.2) works.
step-io = "0.2.4"

[dev-dependencies]
# Test cylinders are built the way an application builds one — a datum, a circle, an extrude
# (`nacre_ops::fixtures`). Dev-only, and nacre-ops depends on this crate only as a dev-dependency
# too, so the library graph stays acyclic (the nacre-props shape).
nacre-ops = { path = "../nacre-ops", features = ["test-util"] }
# Enables topo's test-only `reversed_shell` (a cavity's shell, for the void export test).
nacre-topo = { path = "../nacre-topo", features = ["test-util"] }
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
