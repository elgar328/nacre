[package]
name = "nacre-predicates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Exact geometric predicates for the nacre CAD kernel — indirect predicates (sign decisions on implicit points defined as plane intersections, not coordinates) over the geometry-predicates adaptive-arithmetic base. A pure numeric layer (plane coefficients and coordinates as plain arrays, no kernel types) so it can be extracted as a standalone crate"

[dependencies]
geometry-predicates = "0.3"

[dev-dependencies]
proptest.workspace = true
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
