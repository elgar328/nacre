[package]
name = "nacre-exact"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Everything the nacre CAD kernel can answer exactly in rationals and integers — dimensions and angles that survive f64 (1.1 is 11/10), the canonical names of planes and their meets, quadratic values a + b*sqrt(c), and the exact sign predicates over them"

[dependencies]
num-rational = "0.4"
num-traits = "0.2"
# ★ Not a new crate in the trust base: `num-rational`'s default features already pull `num-bigint`
# and `num-integer` in, so both are compiled into the product path today (`cargo tree`). Declaring
# them is what lets `plane_name_exact` redo an overflowing derivation at unbounded precision.
num-bigint = "0.4"
num-integer = "0.1"
astro-float = "0.9.5"

[dev-dependencies]
proptest.workspace = true
# The f64 twins the integer sign predicates are differentially locked against (test-only; the
# product-path direction stays predicates-free — nacre-predicates does not depend back).
nacre-predicates = { path = "../nacre-predicates" }
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
