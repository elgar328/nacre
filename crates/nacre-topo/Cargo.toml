[package]
name = "nacre-topo"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "b-rep topology (Vertex/Edge/Face/Loop/HalfEdge/Shell/Solid, half-edge) and the truth-only Model aggregate for the nacre CAD kernel — geometry referenced by Handle, provenance carved into Origin"

[dependencies]
nacre-store = { path = "../nacre-store", version = "0.0.0" }
nacre-geom = { path = "../nacre-geom", version = "0.0.0" }
nacre-math = { path = "../nacre-math", version = "0.0.0" }
# The rotation definition (Axis/Angle) stored in a vertex's Origin (overhaul stage 1b).
nacre-scalar = { path = "../nacre-scalar", version = "0.0.0" }

[features]
# Exposes the test-only solid primitive `Model::add_cuboid` (a topo convenience that bypasses
# the ops modelling layer). Off by default, so production consumers never see it; crates below
# nacre-ops enable it in their [dev-dependencies] to build test solids at the topo layer.
# `add_cylinder` joined it in M6-2 (K2), when `ops::Operation::Cylinder` became the production
# road: the f64 entry derives its truth by lifting computed floats and panics outside the decimal
# window, which is a test convenience, not something an application should be able to reach.
test-util = []

[dev-dependencies]
proptest.workspace = true
# Self dev-dependency: `tests/cylinder_truth.rs` pins the f64 entry's derivation, and an
# integration test compiles against the lib without `cfg(test)`. Enabling the feature here — the
# same move the facade crate makes — keeps those tests in the default `cargo test` run.
nacre-topo = { path = ".", features = ["test-util"] }
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
