[package]
name = "nacre-topo"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "b-rep topology (Vertex/Edge/Face/Loop/HalfEdge/Shell/Solid, half-edge) and the truth-only Model aggregate for the nacre CAD kernel — geometry referenced by Handle, provenance carved into Origin"

[dependencies]
nacre-store = { path = "../nacre-store", version = "0.0.0" }
nacre-geom = { path = "../nacre-geom", version = "0.0.0" }
nacre-math = { path = "../nacre-math", version = "0.0.0" }
# The rotation definition (Axis/Angle) stored in a vertex's Origin (overhaul stage 1b).
nacre-exact = { path = "../nacre-exact", version = "0.0.0" }

[features]
# Exposes the planting doors (pushes that skip the funnel or the checks — what a test needs
# to plant a model the product cannot build), `reversed_shell`, `plane_name_through`, the
# motion prefix cache's length (`prefix_hp_len`), and the push counters the census reads
# (`WIDE_PLANES`, `SEEDED_HITS`, `surface_derive_counts`). Off by default, so production
# consumers never see them and a product build counts nothing. Test solids are built
# through the operations (`nacre_ops::fixtures`), not here.
test-util = []

[dev-dependencies]
proptest.workspace = true
# Self dev-dependency: `tests/cylinder_truth.rs` pins the f64 entry's derivation, and an
# integration test compiles against the lib without `cfg(test)`. Enabling the feature here — the
# same move the facade crate makes — keeps those tests in the default `cargo test` run. No
# defaults, so a `--no-default-features` run stays one (`nacre-ops/tests/instruments/manifest.rs`).
nacre-topo = { path = ".", default-features = false, features = ["test-util"] }
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
