[package]
name = "nacre-store"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "typed-index append-only storage (Store<T>/Handle<T>) — geometry/topology-agnostic foundation for the nacre CAD kernel"

[dependencies]

[dev-dependencies]
proptest.workspace = true
# Installs a git pre-commit hook on first `cargo test` (no extra install needed
# on a fresh clone). Hook runs: cargo fmt --check, cargo clippy -- -D warnings,
# cargo test.
cargo-husky = { version = "1", default-features = false, features = [
    "precommit-hook",
    "run-cargo-fmt",
    "run-cargo-clippy",
    "run-cargo-test",
] }
