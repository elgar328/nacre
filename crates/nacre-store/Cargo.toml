[package]
name = "nacre-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Append-only typed storage for the nacre CAD kernel — every object is written once and referenced by an integer handle"
readme = "../LAYER-README.md"

[dependencies]

[dev-dependencies]
proptest.workspace = true
# Installs a git pre-commit hook on first `cargo test` (no extra install needed
# on a fresh clone). The hook itself is `.cargo-husky/hooks/pre-commit`, checked
# in and copied verbatim -- the built-in `run-cargo-clippy` feature lints only
# the library target, leaving `#[cfg(test)]` code unchecked.
cargo-husky = { version = "1", default-features = false, features = [
    "user-hooks",
] }
