[package]
name = "nacre-tess"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "mesh export for the nacre CAD kernel — M1 bootstrap: direct planar triangulation of a Model to OBJ. Grows into provenance-tagged tessellation in M3."

[dependencies]
nacre-store = { path = "../nacre-store", version = "0.0.0" }
nacre-topo = { path = "../nacre-topo", version = "0.0.0" }
nacre-geom = { path = "../nacre-geom", version = "0.0.0" }
nacre-math = { path = "../nacre-math", version = "0.0.0" }
nacre-predicates = { path = "../nacre-predicates", version = "0.0.0" }

[features]
# Exposes the bridge pre-pass on its own (`bridge_report`) so a crate that can build a boolean
# can lock what it split — the same shape as nacre-topo's `test-util`. Never on in a product build.
test-util = []

[dev-dependencies]
# Enables the topo test-only primitive `Model::add_cuboid` for the cube-dump example/tests.
nacre-topo = { path = "../nacre-topo", version = "0.0.0", features = ["test-util"] }
proptest.workspace = true
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
