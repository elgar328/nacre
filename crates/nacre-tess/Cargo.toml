[package]
name = "nacre-tess"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Tessellation for the nacre CAD kernel — crack-free meshes derived from the exact b-rep, each mesh vertex tagged with its origin"
readme = "../LAYER-README.md"

[dependencies]
nacre-store = { workspace = true }
nacre-topo = { workspace = true }
nacre-geom = { workspace = true }
nacre-math = { workspace = true }
nacre-predicates = { workspace = true }
# The outward normal at a mesh corner (`face_normal_at`) for OBJ's `vn` — the rule lives there once.
nacre-props = { workspace = true }

[features]
# Exposes the bridge pre-pass on its own (`bridge_report`) so a crate that can build a boolean
# can lock what it split — the same shape as nacre-topo's `test-util`. Never on in a product build.
test-util = []

[dev-dependencies]
# Test cylinders are built the way an application builds one — a datum, a circle, an extrude
# (`nacre_ops::fixtures`). Dev-only, and nacre-ops depends on this crate only as a dev-dependency
# too, so the library graph stays acyclic (the nacre-props shape).
nacre-ops = { path = "../nacre-ops", features = ["test-util"] }
proptest.workspace = true
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
