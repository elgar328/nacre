[package]
name = "nacre-geom"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "analytic geometry (Plane, Cylinder, Line, Circle) for the nacre CAD kernel — the realization layer: closed-form in shape, f64 in its coefficients; the exact truth lives in nacre-topo"

[dependencies]
nacre-math = { path = "../nacre-math", version = "0.0.0" }
# Exact indirect predicates for three-plane vertex sign decisions (design §9).
# A pure numeric layer with no kernel-crate deps, so this edge is acyclic.
nacre-predicates = { path = "../nacre-predicates", version = "0.0.0" }
# Exact rational scalars, for the Rat twins of the 2-D ring predicates: design §1 isolates
# robustness-sharp classification in geom::intersect, and the profile's truth is rational
# (truth-and-cache), so the predicates over that truth live here too. nacre-scalar sits at the
# bottom of the dependency graph (no nacre-* deps), so this edge is acyclic.
nacre-scalar = { path = "../nacre-scalar", version = "0.0.0" }

[dev-dependencies]
proptest.workspace = true
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
