[package]
name = "nacre-judge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Proved sign decisions for the nacre CAD kernel where coordinates are irrational — an f64 filter that escalates to arbitrary precision and never returns a wrong sign"
readme = "../LAYER-README.md"

[dependencies]
nacre-exact = { workspace = true }
nacre-predicates = { workspace = true }
nacre-math = { workspace = true }
astro-float = "0.9.5"
# Wide frames: a plane whose canonical data exceeds `i128` realizes from arbitrary-precision
# integers. Pure Rust, and already in the product path via nacre-exact.
num-bigint = "0.4"
num-integer = "0.1"

[features]
# When on, the memoized high-precision cell in the kernel's `WitnessPoint` is `Arc<OnceLock>`
# (Send + Sync) instead of `Rc<OnceCell>`. That is what makes the plane table `Sync`, so the
# parallel boolean's workers can *share* it -- the load is on the shared borrow, not on
# anything a worker returns. Off by default; nacre-ops turns it on via its own `parallel`.
parallel = []
# Opens `kernel::frame3::climb_census`, the escalation counters, for the measurements that read
# them from another crate's integration tests (`nacre-ops/tests/wide_datum_cost.rs`). Off by
# default: a product build counts nothing.
test-util = []

[dev-dependencies]
proptest.workspace = true
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
