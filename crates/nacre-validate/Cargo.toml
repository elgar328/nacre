[package]
name = "nacre-validate"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "b-rep invariant checker for the nacre CAD kernel — reference integrity, loop closure, half-edge manifold pairing, geometric incidence, Euler-Poincaré (M1; tessellation checks land in M3)"

[dependencies]
nacre-topo = { path = "../nacre-topo", version = "0.0.0" }
nacre-store = { path = "../nacre-store", version = "0.0.0" }
nacre-math = { path = "../nacre-math", version = "0.0.0" }
# Geometry is below topo (no cycle). The cavity-orientation check reads a planar
# face's normal to sign its signed volume; the M1 checks reach geom's
# distance/normal transitively, this makes that dependency explicit.
nacre-geom = { path = "../nacre-geom", version = "0.0.0" }

[dev-dependencies]
nacre-exact = { path = "../nacre-exact", version = "0.0.0" }
# Enables the topo test-only primitive `Model::add_cuboid` for building test solids.
nacre-topo = { path = "../nacre-topo", version = "0.0.0", features = ["test-util"] }
proptest.workspace = true
# Tests hand-build tetrahedra, so they NAME geom's Curve/Line/Plane/Surface.
# The library itself never names them (method calls only), so geom stays a
# dev-only dependency.
nacre-geom = { path = "../nacre-geom", version = "0.0.0" }
# NOTE: cargo-husky is intentionally NOT declared here. The repo-global git
# pre-commit hook is owned solely by nacre-store; this crate inherits it.
