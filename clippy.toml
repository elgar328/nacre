# Calls the workspace does not make outside the places that own them.
#
# Every exemption — an `allow` or `expect` of `clippy::disallowed_methods` — is listed, with its
# reason, in `crates/nacre-ops/tests/instruments/disallowed.rs`, which also asserts that the
# paths below match its own list. A call blocked here wants the road the reason names, not an
# exemption.

disallowed-methods = [
    # The f64 cache write doors. Product code reaches them only through nacre-ops' realization
    # funnel (`realize.rs`), which realizes the value from the truth or marks the cache `Ceiling`
    # or `Unrealized` — so what STEP reads either took the realization road or says it did not.
    # The empty model's world-plane seeds (`nacre-topo/src/model/mod.rs`) are the one other site.
    { path = "nacre_topo::Model::push_vertex", reason = "a cache write door: push through nacre-ops' realization funnel (`realize.rs`, e.g. `push_vertex_realized`)" },
    { path = "nacre_topo::Model::refine_vertex_cache", reason = "a cache write door: raise through nacre-ops' realization funnel (`realize.rs`, `refine_caches`)" },
    { path = "nacre_topo::Model::push_plane", reason = "a cache write door: push through nacre-ops' realization funnel (`realize.rs`, e.g. `push_plane_realized`)" },
    { path = "nacre_topo::Model::push_plane_through", reason = "a cache write door: push through nacre-ops' realization funnel (`realize.rs`, `push_plane_through_realized`)" },
    { path = "nacre_topo::Model::push_cylinder", reason = "a cache write door: push through nacre-ops' realization funnel (`realize.rs`, `push_cylinder_realized`)" },
    { path = "nacre_topo::Model::refine_surface_cache", reason = "a cache write door: raise through nacre-ops' realization funnel (`realize.rs`, `refine_caches`)" },
    { path = "nacre_topo::Model::push_edge", reason = "a cache write door: push through nacre-ops' realization funnel (`realize.rs`, `push_edge_realized`)" },
    { path = "nacre_topo::Model::rebuild_edge_cache", reason = "a cache write door: re-derive through nacre-ops' realization funnel (`realize.rs`)" },
    { path = "nacre_topo::Model::push_plane_unregistered", reason = "a cache write door for test fixtures only", allow-invalid = true },
    { path = "nacre_topo::Model::push_cylinder_unregistered", reason = "a cache write door for test fixtures only", allow-invalid = true },
    { path = "nacre_topo::Model::plant_surface_name", reason = "a cache write door for test fixtures only", allow-invalid = true },
    # The funnel's door for a cache it already chose: it writes what it is handed, so only a cache
    # `realize::point_cache` answered for this very definition may come through it.
    { path = "nacre_ops::realize::push_vertex_prerealized", reason = "pushes the cache it is handed: use `push_vertex_realized`, or a cache `realize::point_cache` gave for this very definition" },
    # Parallel iteration lives in nacre-ops' `par.rs` alone (`map_range`, `try_map_range`): they
    # collect in index order, so a boolean's handles and its first rejection do not depend on the
    # schedule, and they carry the `#[cfg]` pair that keeps the serial build — the wasm product —
    # compiling. A second place would break either silently.
    { path = "rayon::iter::IntoParallelIterator::into_par_iter", reason = "parallel iteration lives in nacre-ops' `par.rs` (`map_range`, `try_map_range`): index order and the serial build depend on it" },
    { path = "rayon::iter::IntoParallelRefIterator::par_iter", reason = "parallel iteration lives in nacre-ops' `par.rs` (`map_range`, `try_map_range`): index order and the serial build depend on it" },
    { path = "rayon::slice::ParallelSlice::par_chunks", reason = "parallel iteration lives in nacre-ops' `par.rs` (`map_range`, `try_map_range`): index order and the serial build depend on it" },
    { path = "rayon::iter::ParallelBridge::par_bridge", reason = "parallel iteration lives in nacre-ops' `par.rs` (`map_range`, `try_map_range`): index order and the serial build depend on it" },
    { path = "rayon::join", reason = "parallelism lives in nacre-ops' `par.rs`: index order and the serial build depend on it" },
    { path = "rayon::scope", reason = "parallelism lives in nacre-ops' `par.rs`: index order and the serial build depend on it" },
    # "Is this ring inside that one" retries over witnesses in `nesting::cell_inside`; a caller that
    # asks `point_in_ring` itself has one witness and no retry. `nesting::ask` is the one witness's door.
    { path = "nacre_ops::combinatorics::ring_walk::point_in_ring", reason = "ask `nesting::cell_inside`: the retry over witnesses lives there" },
    # A ring is walked against a line once, in `ring_against_plane`, whose flank rule says crossing
    # from touching. Reading `side_of` over a ring's members anywhere else is a second walk. A
    # single point's side is a different question and says so in its `expect`. What this sees is
    # the `side_of` call: a road that walks a ring without it is outside — `point_in_mixed_ring`
    # walks chart coordinates (`QuadVal`), its corner rule `ray_step_crossing`'s, the planar roads'.
    { path = "nacre_ops::combinatorics::ring_walk::side_of", reason = "walk a ring through `ring_against_plane` (the flank rule lives there); a single point's side is asked with an `expect` saying so and its row in nacre-ops' tests/instruments/disallowed.rs" },
    # A rational point is read against a ring once, in `rational_point_in_ring`, which says first
    # what the point's circumstance cannot cure (a silent class's box, a corner with no rational
    # meet) and forks a mixed ring to this walk. A caller that walks the ring itself skips both.
    { path = "nacre_ops::combinatorics::mixed_ring::point_in_mixed_ring", reason = "read a rational point through `combinatorics::rational_point_in_ring` (or a face through `rational_point_in_face`): the order of causes lives there" },
]
